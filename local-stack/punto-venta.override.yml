# Override LOCAL de punto-venta (fuera del repo: docker-compose.override.yml no esta en su .gitignore).
# Uso: docker compose -f ../punto-venta/docker-compose.yml -f punto-venta.override.yml --project-directory ../punto-venta up -d
# - 3000/5173 del host los usa gift-hub: backend -> 3001, frontend -> 5175.
# - Electronica disponible en la instalacion; cada tenant carga sus credenciales SIFEN (PUT /fiscal-credentials).
# - Mail al Mailpit local de electronico-sifen (nunca al SMTP real del .env del repo).
services:
  backend:
    environment:
      ELECTRONIC_INVOICE_ENABLED: "true"
      ELECTRONIC_INVOICE_SYNC_ENABLED: "true"
      CORS_ORIGINS: "http://localhost:5175"
      FRONTEND_URL: "http://localhost:5175"
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_USERNAME: local
      MAIL_PASSWORD: local
      MAIL_FROM: no-reply@pos.local
      NODE_EXTRA_CA_CERTS: /certs/mailpit.crt
    volumes:
      - ../electronico-sifen/.local-stack/mailpit.crt:/certs/mailpit.crt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: !override
      - "3001:3000"
    networks:
      - punto-venta-network
      - sifen

  frontend:
    ports: !override
      - "5175:5173"

networks:
  sifen:
    external: true
    name: electronico-sifen_default
