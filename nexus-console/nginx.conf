# Template: the nginx image runs envsubst on it at startup (only defined env vars, so $uri & co. stay intact).
# NEXUS_API_UPSTREAM defaults to http://nexus-api:8080 in the Dockerfile.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Webhooks accept at most 256 KB (spec §5.4); console requests are far smaller.
    client_max_body_size 256k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Angular marks its <style> tags with the nonce that sub_filter writes into index.html.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Only the admin API and the inbound webhooks are public; the m2m runtime /api/v1/* is not.
    location /api/admin/ {
        proxy_pass ${NEXUS_API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /api/v1/webhooks/ {
        proxy_pass ${NEXUS_API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /api/ {
        return 404;
    }

    location = /index.html {
        expires -1;
        sub_filter_once off;
        sub_filter "**CSP_NONCE**" $request_id;
    }

    # Hashed bundles never change.
    location ~* "-[A-Za-z0-9_-]{8}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
