<a class="skip" href="#main">Saltar al contenido</a>

<div class="layout">
  <header class="topbar">
    <button type="button" class="btn btn-ghost menu-toggle" aria-controls="sidebar"
            [attr.aria-expanded]="menuOpen()" (click)="menuOpen.set(!menuOpen())">
      <span aria-hidden="true">☰</span><span class="visually-hidden">Menú</span>
    </button>
    <a routerLink="/" class="logo"><span class="mark" aria-hidden="true">N</span>Nexus</a>

    @if (scope.isPlatformAdmin()) {
      <div class="tenant-picker">
        <label for="tenant-picker" class="visually-hidden">Tenant</label>
        <select id="tenant-picker" class="select" [value]="scope.tenantId() ?? ''"
                (change)="selectTenant($any($event.target).value)">
          <option value="">Todos los tenants</option>
          @for (tenant of tenants.hasValue() ? tenants.value() : []; track tenant.id) {
            <option [value]="tenant.id" [selected]="tenant.id === scope.tenantId()">{{ tenant.name }}</option>
          }
        </select>
      </div>
    }

    <div class="user">
      <button type="button" class="btn btn-ghost btn-sm" (click)="theme.cycle()" [attr.aria-label]="themeLabel()"
              [title]="themeLabel()">
        <span aria-hidden="true">{{ theme.mode() === 'dark' ? '☾' : theme.mode() === 'light' ? '☀' : '◐' }}</span>
      </button>
      <span class="who">
        <span class="email">{{ user()?.email }}</span>
        <span class="role">{{ roleLabel() }}</span>
      </span>
      <button type="button" class="btn btn-sm" (click)="logout()">Salir</button>
    </div>
  </header>

  <nav id="sidebar" class="sidebar" [class.open]="menuOpen()" aria-label="Secciones">
    <ul>
      @for (item of nav(); track item.path) {
        <li>
          <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page"
             [routerLinkActiveOptions]="{ exact: item.path === '/' }">{{ item.label }}</a>
        </li>
      }
    </ul>
  </nav>

  <main id="main" class="content" tabindex="-1" #main>
    <router-outlet />
  </main>
</div>
