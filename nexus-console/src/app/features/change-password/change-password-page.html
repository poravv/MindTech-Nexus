<main class="auth">
  <section class="brand" aria-hidden="true">
    <p class="mark">N</p>
    <p class="name">MindTech Nexus</p>
    <p class="tag">Por seguridad, la contraseña inicial se reemplaza antes de usar la consola.</p>
  </section>

  <section class="card panel">
    <div>
      <h1>Cambiá tu contraseña</h1>
      <p class="muted">{{ email() }}</p>
    </div>
    <form class="form" (ngSubmit)="submit()" #form="ngForm">
      @if (error(); as message) {
        <p class="alert" role="alert">{{ message }}</p>
      }
      <div class="field">
        <label for="current">Contraseña actual</label>
        <input id="current" name="current" type="password" class="input" autocomplete="current-password" required
               [(ngModel)]="current" />
      </div>
      <div class="field">
        <label for="next">Nueva contraseña</label>
        <input id="next" name="next" type="password" class="input" autocomplete="new-password" required
               [minlength]="minLength" [(ngModel)]="next" aria-describedby="next-hint" />
        <span id="next-hint" class="hint">Mínimo {{ minLength }} caracteres, distinta de la actual.</span>
      </div>
      <div class="field">
        <label for="confirmation">Repetir nueva contraseña</label>
        <input id="confirmation" name="confirmation" type="password" class="input" autocomplete="new-password" required
               [(ngModel)]="confirmation" [attr.aria-invalid]="mismatch()" aria-describedby="confirmation-error" />
        @if (mismatch()) {
          <span id="confirmation-error" class="field-error">No coincide con la nueva contraseña.</span>
        }
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="busy() || form.invalid || mismatch()">
        {{ busy() ? 'Guardando…' : 'Guardar y continuar' }}
      </button>
      <button type="button" class="btn btn-ghost" (click)="logout()">Salir</button>
    </form>
  </section>
</main>
