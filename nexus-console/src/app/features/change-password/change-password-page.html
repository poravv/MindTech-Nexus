<app-auth-frame>
  <div class="intro">
    <h1>Cambiá tu contraseña</h1>
    <p class="muted">Por seguridad, la contraseña inicial de <strong>{{ email() }}</strong> se reemplaza antes de usar la consola.</p>
  </div>

  <form class="form" (ngSubmit)="submit()" #form="ngForm" [attr.aria-busy]="busy()">
    @if (error(); as message) {
      <p class="alert" role="alert">{{ message }}</p>
    }
    <div class="field">
      <label for="current">Contraseña actual</label>
      <input id="current" name="current" class="input" autocomplete="current-password" required
             [type]="showPasswords() ? 'text' : 'password'" [(ngModel)]="current" />
    </div>
    <div class="field">
      <label for="next">Nueva contraseña</label>
      <input id="next" name="next" class="input" autocomplete="new-password" required
             [type]="showPasswords() ? 'text' : 'password'" [minlength]="minLength" [(ngModel)]="next" aria-describedby="next-hint" />
      <span id="next-hint" class="hint">Mínimo {{ minLength }} caracteres, distinta de la actual.</span>
    </div>
    <div class="field">
      <label for="confirmation">Repetir nueva contraseña</label>
      <input id="confirmation" name="confirmation" class="input" autocomplete="new-password" required
             [type]="showPasswords() ? 'text' : 'password'" [(ngModel)]="confirmation" [attr.aria-invalid]="mismatch()"
             aria-describedby="confirmation-error" />
      @if (mismatch()) {
        <span id="confirmation-error" class="field-error">No coincide con la nueva contraseña.</span>
      }
    </div>
    <label class="check">
      <input type="checkbox" [checked]="showPasswords()" (change)="showPasswords.set(!showPasswords())" />Mostrar contraseñas
    </label>
    <button type="submit" class="btn btn-primary submit" [disabled]="busy() || form.invalid || mismatch()">
      {{ busy() ? 'Guardando…' : 'Guardar y continuar' }}
    </button>
    <button type="button" class="btn btn-ghost secondary" (click)="logout()">Salir</button>
  </form>
</app-auth-frame>
