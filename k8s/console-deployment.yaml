# Consola Angular servida por nginx-unprivileged (uid 101). Su nginx hace proxy SOLO de /api/admin/ y
# /api/v1/webhooks/ a nexus-api:8080; el runtime m2m no tiene ruta pública.
# El tag lo escribe deploy.yml (GitOps). Con readOnlyRootFilesystem, dos emptyDir: /tmp (pid y temporales de
# nginx-unprivileged) y /etc/nginx/conf.d (el entrypoint renderiza ahí el template con envsubst al arrancar).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-console
  namespace: nexus
  labels:
    app: nexus-console
    tier: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nexus-console
  template:
    metadata:
      labels:
        app: nexus-console
        tier: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nexus-console
          image: ghcr.io/poravv/mindtech-nexus-console:sha-bbf6028
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
